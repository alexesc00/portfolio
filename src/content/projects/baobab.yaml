name: Baobab
category: Climate
solution: Web platform where a whole company collects its ESG data
practices: [Product design, Design systems]
segment: Business
writeUp:
  problem: >-
    Baobab is a web platform where a whole company collects its environmental,
    social and governance (ESG) data. Leaders give each impact area to the staff
    who know it, so reporting no longer falls on one consultant.
  approach: >-
    I built the component library in Figma first. Worksheets, dashboards and
    team pages were assembled from the same parts, and a developer built the app
    directly from the library.
  outcome: >-
    The interface is now used to track sustainability on residential
    construction projects.
