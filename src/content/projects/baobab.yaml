order: 6
locked: false
name: Baobab
category: Climate
solution: Web platform where a whole company collects its ESG data
practices: [Product design, Design systems]
segment: Business
writeUp:
  problem: >-
    Before Baobab, a company’s environmental, social and governance (ESG)
    reporting fell on one consultant instead of the staff who knew each impact
    area.
  approach: >-
    In Baobab, leaders hand each impact area to the staff who know it. I built
    the component library in Figma first, so every worksheet, dashboard and team
    page came from the same parts, and a developer built the app from it.
  outcome: >-
    The interface now tracks sustainability on residential construction
    projects.
isLive: true
tools: [Figma]
