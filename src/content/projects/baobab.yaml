name: Baobab
category: Climate
solution: Web platform where a whole company collects its ESG data
practices: [Product design, Design systems]
segment: Business
writeUp:
  - >-
    Baobab is a web platform where a whole company collects its environmental,
    social and governance (ESG) data, for the leaders and staff of smaller
    consumer brands. Brands need data behind their impact claims, but reporting
    usually falls on one consultant.
  - >-
    Leaders assign team members to each impact area, so data entry is spread
    across the staff instead of falling on one person. I split areas into
    modules, then worksheets that share a layout and show progress. The
    interface is now used to track sustainability on residential construction
    projects.
