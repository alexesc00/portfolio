name: Curriculum Alignment Tool
category: Government AI
solution: AI tool that checks courses against 74 cyber work roles
practices: [Product design, Development]
segment: Government
writeUp:
  problem: >-
    Every analysis ran 74 AI checks, one per Defense Department cyber work role,
    and each returned about two screens of output. It all had to fit in
    Streamlit, MissionML’s stack at the time, for a program lead who wanted it
    flashy, modern and sleek.
  approach: >-
    I pushed Streamlit’s components and state past what they were made for. A
    grid of 74 squares fills in green or gray as each check finishes, so the
    answer fits on one screen. Only the roles someone opens become tabs.
  outcome: >-
    Production kept the coverage chart, result cards and evidence tables.
tools: [Cursor]
