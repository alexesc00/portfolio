name: MissionML design system
category: Government AI
solution: Branded design system for prototyping AI apps in Streamlit
practices: [Design systems, Brand identity, Development]
segment: Government
writeUp:
  - >-
    The MissionML design system is a theme and a stylesheet that make Streamlit
    apps look like MissionML. The company prototyped AI apps for federal
    agencies in Streamlit, but every prototype came out in the framework’s
    stock look.
  - >-
    I restyled Streamlit’s own widgets with one stylesheet of about 800 lines
    and added the components it lacks, each one Python call. I tagged every
    rule, so a page can switch the brand off and show the stock look. Across
    two federal projects, the team built about fifteen prototypes on it.
