name: MissionML design system
category: Government AI
solution: Branded design system for prototyping AI apps in Streamlit
practices: [Design systems, Brand identity, Development]
segment: Government
writeUp:
  problem: >-
    MissionML had just split off from its parent company and needed its own
    look. I designed the new brand, but the AI apps it prototyped for federal
    agencies in Streamlit still came out in the framework’s stock look.
  approach: >-
    I restyled Streamlit’s own widgets with a brand theme and one stylesheet of
    about 800 lines, and added the components it lacks, each one Python call.
    FDEs could then prototype AI apps rapidly, already in the MissionML look.
  outcome: >-
    Across two federal projects, the team built about fifteen prototypes on it.
isLive: true
tools: [Figma, Cursor]
