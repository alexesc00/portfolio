name: Stanford Mobile
category: Education
solution: University campus app that puts the most-used screens first
practices: [App design, Research]
segment: Consumer
writeUp:
  - >-
    Stanford Mobile is the university’s campus app for first-year students and
    visitors: bus schedules, dining halls and events. People needed the
    information they used most, but it was buried, and planning a campus bus
    trip meant remembering details between screens.
  - >-
    My redesign puts the home screen in order of use: health check and mobile
    ID first, then dining and transport, with events gathered at the bottom. I
    added defaults to the trip planner, which starts from the rider’s current
    location and will not confirm a trip without a destination.
