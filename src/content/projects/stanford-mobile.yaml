order: 5
locked: false
name: Stanford Mobile
category: Education
solution: University campus app that puts the most-used screens first
practices: [App design, Research]
segment: Consumer
writeUp:
  problem: >-
    First-year students and visitors open the campus app for bus schedules,
    dining halls and events. The information they used most was buried, and
    planning a bus trip meant remembering details between screens.
  approach: >-
    My redesign puts the home screen in order of use: health check and mobile ID
    first, then dining and transport, with events at the bottom. I added
    defaults to the trip planner, which starts from the rider’s location and
    will not confirm a trip without a destination.
tools: [Figma]
