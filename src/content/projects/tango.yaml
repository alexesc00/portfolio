order: 6
locked: false
name: Tango
category: Transit
solution: Transit app that pairs students with a riding buddy
practices: [App design, Web design]
segment: Consumer
writeUp:
  problem: >-
    Students who ride transit alone in big cities need company against
    harassment. Testers worried about finding a buddy in a busy station with no
    way to reach them.
  approach: >-
    Tango matches riders on similar routes and gives each pair an in-app chat
    for meeting at the station, with a way to ask for a new match. I designed
    every screen, from matching to rating a buddy at the end, and built the
    landing page myself.
tools: [Figma]
